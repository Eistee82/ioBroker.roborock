<!doctype html>
<html>
	<head>
		<title>Roborock Map</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script src="/socket.io/socket.io.js"></script>
		<script type="module" src="./app.js"></script>

		<style>
			/* --- Layout --- */
			:root {
				--rr-bg: #000000;
				--rr-panel: #1a1a1a;
				--rr-border: #4f4f4f;
				--rr-accent: #2d9cdb;
				--rr-accent-hover: #47a9dc;
				--rr-text: #f0f0f0;
				--rr-text-dim: #a8a8a8;
				--rr-error: #ff5b52;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				background-color: var(--rr-bg);
				color: var(--rr-text);
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					"Open Sans",
					"Helvetica Neue",
					sans-serif;
			}

			[hidden] {
				display: none !important;
			}

			#layout {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 320px;
				gap: 12px;
				padding: 12px;
				height: 100vh;
			}

			#mapPane {
				display: flex;
				flex-direction: column;
				gap: 8px;
				min-width: 0;
				min-height: 0;
			}

			/* --- Status bar --- */
			#statusBar {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 6px 18px;
				padding: 8px 12px;
				border: 1px solid var(--rr-border);
				border-radius: 10px;
				background-color: var(--rr-panel);
				font-size: 14px;
			}

			.status-item {
				display: flex;
				gap: 6px;
				align-items: baseline;
			}

			.status-label {
				color: var(--rr-text-dim);
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}

			.status-value {
				font-weight: 600;
			}

			#statusError {
				flex-basis: 100%;
				color: var(--rr-error);
				font-weight: 600;
			}

			/* --- Map --- */
			#mapSvgContainer {
				position: relative;
				flex: 1 1 auto;
				min-height: 260px;
				border: 2px solid var(--rr-border);
				box-shadow: 0px 0px 10px #333;
				border-radius: 15px;
				overflow: hidden; /* Important for Pan/Zoom constraints */
				background-color: var(--rr-panel);
			}

			#mapSvg {
				width: 100%;
				height: 100%;
				display: block;
				cursor: grab;
			}

			#mapSvg:active {
				cursor: grabbing;
			}

			#mapPlaceholder {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--rr-text-dim);
				pointer-events: none;
				text-align: center;
				padding: 20px;
			}

			#messageBar {
				padding: 8px 12px;
				border-radius: 10px;
				border: 1px solid var(--rr-error);
				background-color: rgba(255, 91, 82, 0.12);
				color: var(--rr-error);
				font-size: 14px;
			}

			/* --- Control panel --- */
			#controls {
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 12px;
				border: 1px solid var(--rr-border);
				border-radius: 10px;
				background-color: var(--rr-panel);
				overflow-y: auto;
				min-width: 0;
			}

			.control-group {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}

			.control-group > h2 {
				margin: 0;
				font-size: 12px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--rr-text-dim);
			}

			.control-row {
				display: flex;
				gap: 6px;
			}

			.control-row > * {
				flex: 1 1 0;
				min-width: 0;
			}

			.control-hint {
				margin: 0;
				font-size: 12px;
				color: var(--rr-text-dim);
			}

			label.field {
				display: flex;
				flex-direction: column;
				gap: 4px;
				font-size: 12px;
				color: var(--rr-text-dim);
			}

			button,
			select {
				width: 100%;
				padding: 10px 12px;
				border-radius: 10px;
				background-color: var(--rr-accent);
				color: var(--rr-text);
				cursor: pointer;
				transition: background-color 0.2s ease-in-out;
				font-size: 15px;
				font-weight: bold;
				border: 1px solid var(--rr-border);
			}

			button:hover:not(:disabled),
			select:hover {
				background-color: var(--rr-accent-hover);
			}

			button:disabled {
				color: gray;
				background-color: lightgray;
				cursor: not-allowed;
			}

			/* --- Collapsible panels (consumables / dock) --- */
			.panel {
				border: 1px solid var(--rr-border);
				border-radius: 10px;
				background-color: rgba(255, 255, 255, 0.03);
			}

			.panel > summary {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 8px;
				padding: 10px 12px;
				cursor: pointer;
				font-size: 12px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: var(--rr-text-dim);
				list-style: none;
			}

			.panel > summary::-webkit-details-marker {
				display: none;
			}

			.panel > summary::before {
				content: "▸";
				font-size: 11px;
				line-height: 1;
			}

			.panel[open] > summary::before {
				content: "▾";
			}

			.panel > summary:hover {
				color: var(--rr-text);
			}

			.panel-badge {
				margin-left: auto;
				padding: 2px 8px;
				border-radius: 999px;
				background-color: var(--rr-error);
				color: #ffffff;
				font-size: 11px;
				letter-spacing: 0;
			}

			.panel-body {
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 0 12px 12px;
			}

			/* --- Consumables --- */
			.consumable {
				display: flex;
				flex-direction: column;
				gap: 6px;
				padding-top: 10px;
				border-top: 1px solid var(--rr-border);
			}

			.consumable:first-child {
				border-top: none;
				padding-top: 0;
			}

			.consumable-head {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 4px 8px;
			}

			.consumable-name {
				font-size: 14px;
				font-weight: 600;
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.consumable-due {
				margin-left: auto;
				color: var(--rr-error);
				font-size: 12px;
				font-weight: 700;
			}

			.consumable-values {
				display: flex;
				flex-wrap: wrap;
				gap: 2px 12px;
				font-size: 12px;
				color: var(--rr-text-dim);
			}

			.consumable-meter {
				height: 6px;
				border-radius: 999px;
				background-color: rgba(255, 255, 255, 0.12);
				overflow: hidden;
			}

			.consumable-meter > span {
				display: block;
				height: 100%;
				width: 0;
				border-radius: 999px;
				background-color: var(--rr-accent);
				transition: width 0.2s ease-in-out;
			}

			.consumable.is-due .consumable-meter > span {
				background-color: var(--rr-error);
			}

			.consumable-confirm {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
			}

			.consumable-confirm > .control-hint {
				flex: 1 1 100%;
			}

			.consumable-confirm > button {
				flex: 1 1 120px;
			}

			button.secondary {
				background-color: transparent;
				color: var(--rr-text-dim);
			}

			button.secondary:hover:not(:disabled) {
				background-color: rgba(255, 255, 255, 0.08);
				color: var(--rr-text);
			}

			button.danger {
				background-color: var(--rr-error);
			}

			button.danger:hover:not(:disabled) {
				background-color: #ff7a73;
			}

			/* --- Dock --- */
			.dock-grid {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}

			.dock-grid > * {
				flex: 1 1 130px;
				min-width: 0;
			}

			#dockModes,
			#dockStatusList {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}

			#dockModes:empty,
			#dockStatusList:empty {
				display: none;
			}

			.dock-status-row {
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between;
				gap: 2px 12px;
				font-size: 13px;
			}

			.dock-status-row > .dock-status-name {
				color: var(--rr-text-dim);
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.dock-status-row > .dock-status-value {
				font-weight: 600;
				text-align: right;
			}

			/* --- Interactive SVG elements --- */
			.zone-rect {
				fill: rgba(255, 255, 255, 0.5);
				stroke: white;
				stroke-width: 1.5;
				cursor: move;
			}

			.zone-handle {
				fill: red;
				cursor: nwse-resize;
			}

			.obstacle-marker {
				fill: rgba(0, 150, 255, 0.7);
				stroke: white;
				stroke-width: 0.5;
				vector-effect: non-scaling-stroke;
				cursor: pointer;
				transition: r 0.1s ease-in-out;
			}
			.obstacle-marker:hover {
				fill: rgba(0, 200, 255, 0.9);
			}

			.room-label.selectable {
				cursor: pointer;
			}

			.go-to-pin {
				cursor: crosshair;
			}

			/* --- Popup styling --- */
			#popup {
				display: none;
				position: absolute;
				background-color: white;
				border-radius: 5px;
				padding: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
				pointer-events: none;
				transform: translate(-50%, -100%);
				margin-top: -15px;
				z-index: 10;
			}

			#popup-image {
				display: block;
				width: 100px;
				height: 100px;
				border: 1px solid black;
				cursor: pointer;
				pointer-events: auto;
			}

			#triangle {
				display: none;
				position: absolute;
				bottom: -10px;
				left: 50%;
				transform: translateX(-50%);
				width: 0;
				height: 0;
				border-style: solid;
				border-width: 10px 10px 0 10px;
				border-color: white transparent transparent transparent;
				z-index: 10;
			}

			#largePhoto {
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				display: none;
				position: fixed;
				z-index: 1000;
				border: 2px solid white;
				box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
			}

			#largePhoto-image {
				display: block;
				max-width: 80vw;
				max-height: 80vh;
				width: auto;
				height: auto;
			}

			#largePhoto-bbox {
				display: none;
				position: absolute;
				border: 3px solid #ff3b30;
				box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
				pointer-events: none;
				z-index: 1001;
			}

			.hovered-option {
				background-color: var(--rr-accent-hover) !important;
			}

			/* --- Narrow screens: controls move below the map --- */
			@media (max-width: 860px) {
				#layout {
					grid-template-columns: minmax(0, 1fr);
					grid-template-rows: minmax(280px, 60vh) auto;
					height: auto;
					min-height: 100vh;
				}

				#controls {
					overflow-y: visible;
				}
			}
		</style>
	</head>
	<body>
		<div id="layout">
			<section id="mapPane">
				<div id="statusBar">
					<div class="status-item">
						<span class="status-label" data-i18n="ui_state">State</span>
						<span class="status-value" id="statusState">–</span>
					</div>
					<div class="status-item">
						<span class="status-label" data-i18n="ui_battery">Battery</span>
						<span class="status-value" id="statusBattery">–</span>
					</div>
					<div class="status-item">
						<span class="status-label" data-i18n="ui_area">Area</span>
						<span class="status-value" id="statusArea">–</span>
					</div>
					<div class="status-item">
						<span class="status-label" data-i18n="ui_duration">Duration</span>
						<span class="status-value" id="statusDuration">–</span>
					</div>
					<!-- Filled from Devices.<duid>.connection.preferred; hidden while that state is absent. -->
					<div class="status-item" id="statusConnectionItem" hidden>
						<span class="status-label" data-i18n="ui_connection">Connection</span>
						<span class="status-value" id="statusConnection">–</span>
					</div>
					<div id="statusError" hidden></div>
				</div>

				<div id="mapSvgContainer">
					<svg id="mapSvg" width="450" height="450"></svg>
					<div id="mapPlaceholder" data-i18n="ui_loading_map">Waiting for map data…</div>
				</div>

				<div id="messageBar" hidden></div>
			</section>

			<section id="controls">
				<div class="control-group">
					<label class="field">
						<span data-i18n="ui_device">Device</span>
						<select id="robotSelect"></select>
					</label>
					<label class="field" id="floorField" hidden>
						<span data-i18n="ui_floor">Floor</span>
						<select id="floorSelect"></select>
					</label>
				</div>

				<div class="control-group" id="modeGroup" hidden>
					<label class="field" id="fanPowerField" hidden>
						<span data-i18n="ui_fan_power">Suction power</span>
						<select id="fanPowerSelect"></select>
					</label>
					<label class="field" id="mopModeField" hidden>
						<span data-i18n="ui_mop_mode">Mop mode</span>
						<select id="mopModeSelect"></select>
					</label>
					<label class="field" id="waterFlowField" hidden>
						<span data-i18n="ui_water_flow">Water flow</span>
						<select id="waterFlowSelect"></select>
					</label>
				</div>

				<div class="control-group">
					<h2 data-i18n="ui_rooms">Rooms</h2>
					<p class="control-hint" id="roomHint" data-i18n="ui_rooms_hint">Click a room name in the map to select it.</p>
					<button id="cleanRoomsButton" disabled data-i18n="ui_clean_rooms">Clean selected rooms</button>
					<button id="clearRoomsButton" disabled data-i18n="ui_clear_selection">Clear selection</button>
				</div>

				<div class="control-group">
					<h2 data-i18n="ui_zones">Zones</h2>
					<label class="field">
						<span data-i18n="ui_repeat">Passes</span>
						<select id="cleanCount">
							<option value="1" data-i18n="ui_repeat_once">1 pass</option>
							<option value="2" data-i18n="ui_repeat_twice">2 passes</option>
						</select>
					</label>
					<div class="control-row">
						<button id="addButton" data-i18n="ui_add_zone">Add zone</button>
						<button disabled id="deleteButton" data-i18n="ui_remove_zone">Remove zone</button>
					</div>
					<p class="control-hint" id="zoneHint"></p>
				</div>

				<div class="control-group">
					<h2 data-i18n="ui_control">Control</h2>
					<div class="control-row" id="robotButtons">
						<button id="startButton" data-i18n="ui_start">Start</button>
						<button id="pauseButton" hidden data-i18n="ui_pause">Pause</button>
						<button id="stopButton" data-i18n="ui_stop">Stop</button>
					</div>
					<button id="dockButton" data-i18n="ui_dock">Dock</button>
					<button id="goToButton" data-i18n="ui_goto">Go to point</button>
					<button id="resetZoomButton" data-i18n="ui_reset_view">Reset view</button>
				</div>

				<!-- Both panels are filled from the device objects and stay hidden while the device has none. -->
				<details class="panel" id="consumablesPanel" hidden>
					<summary>
						<span data-i18n="ui_consumables">Consumables</span>
						<span class="panel-badge" id="consumablesBadge" hidden></span>
					</summary>
					<div class="panel-body" id="consumablesList"></div>
				</details>

				<details class="panel" id="dockPanel" hidden>
					<summary>
						<span data-i18n="ui_dock_panel">Dock station</span>
						<span class="panel-badge" id="dockBadge" hidden></span>
					</summary>
					<div class="panel-body">
						<div class="dock-grid" id="dockActions"></div>
						<div id="dockModes"></div>
						<div id="dockStatusList"></div>
						<p class="control-hint" id="dockStatusHint" hidden data-i18n="ui_dock_no_status">No dock status data available for this device.</p>
					</div>
				</details>
			</section>
		</div>

		<div id="popup">
			<img id="popup-image" src="" alt="Obstacle Preview" />
			<div id="triangle"></div>
		</div>

		<div id="largePhoto">
			<img id="largePhoto-image" src="" alt="Obstacle Detail" />
			<div id="largePhoto-bbox"></div>
		</div>
	</body>
</html>
